name: Native macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version to GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install test engine
        run: brew install clamav yara-x gnupg rsync
      - name: Unit and real-engine fixture tests
        env:
          MARS_CLAMAV_TESTS: "1"
          MARS_SOURCE_NETWORK_TESTS: "1"
        run: swift test
      - name: Package universal native app
        run: bash scripts/package.sh
      - name: Capture native interface with synthetic data
        run: |
          capture() {
            NAME="$1"; shift
            dist/Mars.app/Contents/MacOS/mars --demo --screenshot "$PWD/dist/screenshot-$NAME.png" "$@" &
            PID=$!
            for ATTEMPT in {1..30}; do
              if ! kill -0 "$PID" 2>/dev/null; then break; fi
              sleep 1
            done
            if kill -0 "$PID" 2>/dev/null; then kill "$PID"; exit 1; fi
            wait "$PID"
            test -s "dist/screenshot-$NAME.png"
          }
          for PAGE in overview scan schedule history settings; do capture "$PAGE" --page "$PAGE"; done
          capture overview-dark --dark
          capture overview-compact --compact
          capture sources --sources
          capture scanning --scanning
          capture results --results
          capture optional-source --results --skipped-source
      - name: Preserve failed UI captures for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Mars-native-ui-debug
          path: dist/screenshot-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Mars-macOS-universal
          path: |
            dist/Mars-*-macOS-universal.zip
            dist/SHA256SUMS.txt
            dist/screenshot-*.png
            assets/app.png
          retention-days: 30
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: Mars-macOS-universal
          path: release-assets
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^VERSION=//p' scripts/package.sh)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          if gh release view "$TAG" --json isDraft > /tmp/mars-release.json 2>/dev/null; then
            if [ "$(jq -r .isDraft /tmp/mars-release.json)" != true ]; then
              echo "::error::Published version already exists. Never replace published release assets."
              exit 1
            fi
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Mars $VERSION" --draft --notes-file "docs/RELEASE-$VERSION.md"
          fi
          gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file "docs/RELEASE-$VERSION.md"
          (cd release-assets/dist && sha256sum -c SHA256SUMS.txt)
          gh release upload "$TAG" "release-assets/dist/Mars-$VERSION-macOS-universal.zip" release-assets/dist/SHA256SUMS.txt
          gh release edit "$TAG" --draft=false --prerelease=false --latest
